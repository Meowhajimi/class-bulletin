<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>班级公告栏</title>
  <meta name="description" content="班级公告栏：查看班级通知与作业提醒。" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!--
    分享卡片（微信 / QQ / 其它社交平台）。

    为什么必须写在 HTML 源码里：这些平台的爬虫**不执行 JavaScript**，
    用 JS 填的标签它们读不到 —— 那样分享到群里就只有光秃秃一个网址。
    og:url 与 canonical 由 tools/package-web.py 在打包时按 config 注入。
  -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="班级公告栏" />
  <meta property="og:title" content="班级公告栏" />
  <meta property="og:description" content="班级通知与作业提醒，同学只读浏览。" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="canonical" href="./" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="site-header__top">
        <div>
          <h1 class="site-title" id="site-title">班级公告栏</h1>
          <p class="site-subtitle" id="site-subtitle" hidden></p>
        </div>
        <button class="btn btn--ghost" id="refresh" type="button">刷新</button>
      </div>
      <p class="site-header__status" id="status-line"></p>
      <div class="site-header__filters" id="filters"></div>
    </header>

    <main class="main" id="main">
      <noscript>
        <div class="noscript-box">这个页面需要开启 JavaScript 才能显示公告内容，请在浏览器设置里打开。</div>
      </noscript>
    </main>

    <footer class="site-footer">
      <span class="site-footer__row">
        <button type="button" class="footer-link" id="download-backup">下载 Word 备份</button>
        <a class="footer-link" href="admin.html">学习委员入口</a>
        <!-- 源码仓库：地址在 config.js 的 site.repoUrl；留空则自动隐藏 -->
        <a
          class="footer-link"
          id="repo-link"
          href="https://github.com/Meowhajimi/class-bulletin"
          target="_blank"
          rel="noopener noreferrer"
          hidden
          >源码</a
        >
      </span>
      <span class="site-footer__row">
        <span id="footer-note"></span>
        <!-- 在线人数：不起眼的一行小字，app.js 填内容 -->
        <span class="footer-online" id="online-count" hidden></span>
      </span>
    </footer>
  </div>

  <div class="toast-stack" id="toasts" aria-live="polite"></div>

  <!-- 有紧急公告时显示在右下角（app.js 负责填充） -->
  <a class="urgent-flag" id="urgent-flag" hidden></a>

  <script type="module" src="js/app.js"></script>
</body>
</html>
